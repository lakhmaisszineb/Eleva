Technique: Loyalty Program
Goal: Increase customer retention and lifetime value through rewards and recognition
When to use: When repeat purchase rate is low or when you want to turn loyal customers into advocates
Recommended Actions:
  - Define clear tiers (e.g. Silver, Gold, Platinum) based on spend or frequency
  - Offer points for purchases, reviews and referrals
  - Give exclusive benefits to higher tiers (early access, free shipping, gifts)
  - Communicate progress and rewards regularly
KPIs:
  - Repeat Purchase Rate
  - Customer Lifetime Value
  - Program Enrollment Rate
  - Redemption Rate