Technique: Welcome Campaign
Goal: Onboard new customers and encourage the second purchase
When to use: Right after a customer makes their first purchase or creates an account
Recommended Actions:
  - Send a welcome email within 1 hour
  - Educate about the brand and best-sellers
  - Offer a small incentive for the second order (time-limited)
  - Ask for preferences to personalize future communications
KPIs:
  - Second Purchase Rate
  - Email Open Rate
  - Time to Second Order