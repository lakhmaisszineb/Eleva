Technique: Win-back / Reactivation Campaign
Goal: Re-engage inactive or churned customers
When to use: Customers who have not purchased for a significant period (e.g. 90-180+ days)
Recommended Actions:
  - Segment by recency and past value
  - Send a personalized "We miss you" message
  - Highlight new products or improvements
  - Use a strong but limited incentive for high-value past customers
KPIs:
  - Reactivation Rate
  - Revenue from Reactivated Customers
  - Unsubscribe Rate