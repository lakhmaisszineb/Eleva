Technique: Cross-selling / Upselling
Goal: Increase average order value and customer lifetime value
When to use: During browsing, at checkout, or in post-purchase communications
Recommended Actions:
  - Recommend complementary products (cross-sell)
  - Suggest higher-value alternatives or bundles (upsell)
  - Use purchase history and browsing behavior for personalization
  - Apply gentle, relevant offers rather than aggressive pushing
KPIs:
  - Average Order Value
  - Attach Rate
  - Revenue from recommendations